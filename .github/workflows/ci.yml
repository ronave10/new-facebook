name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://campaignos:campaignos@localhost:5432/campaignos
      JWT_ACCESS_SECRET: ci-access-secret-000000000000
      JWT_REFRESH_SECRET: ci-refresh-secret-00000000000
      CREDENTIALS_ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campaignos
          POSTGRES_PASSWORD: campaignos
          POSTGRES_DB: campaignos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campaignos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build web
        run: pnpm --filter @campaignos/web build
