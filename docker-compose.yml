version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: campaignos-postgres
    environment:
      POSTGRES_USER: campaignos
      POSTGRES_PASSWORD: campaignos
      POSTGRES_DB: campaignos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaignos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: campaignos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: campaignos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: campaignos
      MINIO_ROOT_PASSWORD: campaignos-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
